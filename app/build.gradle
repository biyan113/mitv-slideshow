plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pan.tvgallery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pan.tvgallery'
        // 小米电视多为 Android 5.x–11，minSdk 21 覆盖绝大多数机型
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 侧载安装用，直接用 debug 证书签名
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 只用到二维码编码，3.5.x 仅依赖 API 19+ 的 StandardCharsets，兼容 Android 5
    implementation 'com.google.zxing:core:3.5.4'
}
